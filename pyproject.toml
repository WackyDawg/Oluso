[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oluso-ato"
version = "1.4.0"
description = "Explainable behavioural account-takeover detection for Nigerian app, USSD, and agent channels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oluso contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn==1.9.1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37,<2", "requests>=2.32,<3", "python-dotenv>=1.0,<2"]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.6,<1", "bandit>=1.7,<2", "pip-audit>=2.7,<3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
